# fastjson2 2.0.65 自带的 META-INF/native-image Args 把 JSONFactory 等强制为 build-time init，
# 但 JSONFactory.<clinit> 会 new PropertyAccessorFactoryUnsafe()，连带初始化
# PropertyAccessorFactoryLambda / PropertyAccessorFactoryUnsafe——这两个类因静态块含 Unsafe/MethodHandles
# 被 native-image 自动推迟为 run-time init，于是报 "unintentionally initialized at build time"。
# 两个类的 <clinit> 均为平凡操作（USE_UNSAFE = JDKUtils.UNSAFE != null / 空），
# 显式 bless 为 build-time 与 fastjson2 自己对 JDKUtils 的处理方式一致，安全。
# 注意：类初始化配置没有 JSON 载体（reflect/jni/proxy 等才有），本 properties 文件就是
# META-INF/native-image 元数据的标准载体，随 Task 2 的 6 个 JSON 一起生效。
Args=--initialize-at-build-time=com.alibaba.fastjson2.introspect.PropertyAccessorFactoryLambda,com.alibaba.fastjson2.introspect.PropertyAccessorFactoryUnsafe
